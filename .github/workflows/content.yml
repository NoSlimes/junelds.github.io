name: Build content data

# Bygger ihop content/ (en fil per post, redigeras via Decap på /admin)
# till data/*.yml (läses av sidan). Samma mönster som gallery-index.

on:
  push:
    branches: [ main ]
    paths:
      - 'content/**'
      - 'scripts/combine_content.py'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Combine content fragments
        run: python scripts/combine_content.py

      - name: Commit generated data if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --staged --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'chore: rebuild data from content'
            git push
          fi
