hero:
  rubrik: "Välkommen till Junelds"
  text: "Upplev den småländska naturen från hästryggen eller bakom en trygg ardenner. Vi erbjuder ridning och turkörning i trolsk granskog. Vi erbjuder även inkörning, lektionsverksamhet, skogsuppdrag och övriga tjänster med häst."
  knapp: "Se våra turer"
omOss:
  stycke1: "Vi på Junelds har en passion för hästar och den svenska naturen. Vårt stall ligger i hjärtat av Småland, omgivet av vackra skogar och ängar."
  stycke2: "Våra turer går främst på stigar genom härlig, trolsk granskog och på grusvägar. Den övergripande tanken är stillsamma, mysiga turer med främst skritt, men även lite trav och galopp efter önskemål för de mer erfarna."
