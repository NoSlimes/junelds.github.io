title: Bröllopskörning
ordning: 69
id: brollopskorning
summary: >
  Häst och vagn för er stora dag – sagolik bröllopsfärd.

  Gör resan till och/eller från bröllopsplatsen lite extra minnesvärd genom att åka efter en härlig och dessutom hjärtformad ardennerrumpa.

  Vad kan väl vara mer passande på denna kärlekens dag?


  I bokningskostnaden ingår 30 minuters konsultation på platsen där bröllopskörningen ska äga rum.

  Kusk och medhjälpare är stiligt uppklädda och vagnen kan får vackert dekorerad efter önskemål.
description: >
  Gör er bröllopsdag oförglömlig med en storslagen entré i häst och vagn!


  Vi skräddarsyr efter era önskemål – från kyrkan till festlokalen, eller en romantisk tur för brudparet.


  Lugna trygga hästar och erfaren kusk. Vi finns i Kårestad med omnejd.
