ordning: 70
id: skymningsturen
title: Skymningsturen
summary: Sagolik skymningstur med historier och stämning.
description: 'Går genom trolsk Småländsk granskog och bymiljö. Jag berättar om sägner och historier från bygden.


  Kanske får man se ett troll och man får höra var de huvudlösa kalvarna brukar synas om natten. (Går givetvis att boka dagtid också.)

  '
details:
- 'Längd: ca 45 minuter'
- 'Typ: Häst och vagn'
