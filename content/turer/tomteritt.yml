id: tomteritt
title: Tomten kommer till häst
summary: Ett magiskt hembesök av ridande tomte.
description: 'Hyr in en ridande tomte med ardennern Lukas! Tomten rider fram till dörren (där ni gärna får klappa hästen) och kommer sedan in för att dela ut julklappar.


  En nisse är med och håller hästen. Vi utgår från Kårestad och besöker byarna runtomkring (t.ex. Hovmantorp, Högstorp). Julklappar lämnas till oss i förväg.

  '
