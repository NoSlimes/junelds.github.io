title: Tomtetur – Spana efter tomtar
summary: Häst och vagn i skogen för barnen.
description: 'Följ med ut i den småländska granskogen och spana efter tomtar i lyktans sken!


  Vagnen rymmer 10 barn, vuxna är välkomna att följa med till fots. Turen är ca 3 km.


  Klä er varmt och lämna ficklampan hemma (tomtarna är skygga) – lyktor finns att låna.

  '
