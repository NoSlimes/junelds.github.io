title: Höstritt med värmande fika
ordning: 20
date: 2026-11-01
text: >-
  Följ med på en härlig höstritt i vår vackra natur – Turen är ca fyra
  timmar  inklusive fikapaus med värmande fika.


  Detta är en ritt för dig som är en självständigt behärskar att rida hästen i alla gångarter och är relativt van i sadeln. Det blir många timmar på hästryggen och bitvis i ganska svår terräng med mycket backar.\

  Efter ca halva ridturen pausar vi en liten stund för att äta en värmande fika i naturen.


  Maxvikt för att kunna delta på denna tur är 115 kg


  OBS! Datum är ännu inte fastställt.


  **Praktisk info:**


  * Längd: ca 4 timmar inkl. fikapaus

  * Kostnad 1500 kr per person inkl. fika

  * Intresseanmälan: kontakta oss via formuläret nedan


  Varmt välkommen!
