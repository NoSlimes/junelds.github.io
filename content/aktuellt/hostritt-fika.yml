title: Höstritt med värmande Skogslunch
ordning: 20
date: 2026-11-01
text: >-
  HÖSTRITTMED VÄRMANDE SKOGSLUNCH \

  – SÖNDAG 22 NOVEMBER 


  Upplev den sena höstens magi från ryggen på en maffig ardenner!


  Nu bjuder vi på Junelds – Med hästen som partner in till en exklusiv långritt i det vackra småländska landskapet.


  Vårt äventyr utgår från Kårestad, kl. 10:00. Söndagen den 22 November. \

  Tillsammans med våra trygga ardennerhästar rider vi en härlig och stärkande runda genom skog och mark, under en 4-timmar lång upplevelse. \

  ***\-Friskvård för både kropp och själ!-***


  Halvvägs stannar vi på en mysig plats i skogen. 


  Medan hästarna vilar och mumsar på sitt hö, dukar vi upp en rykande het soppa med nybakat bröd


  – Ett perfekt sätt att måna om sig själv och njuta av naturens stillhet.


  **Information& Bokning:**


  Datum& Tid: Söndag 22 november kl. 10:00


  Utgångspunkt: Kårestad (Småland), 1,5 mil nord/ost om Växjö


  Antal platser: Max 4 deltagare (för en personlig och lugn grupp)


  Krav på ridvana: God ridvana krävs då vi rider i varierad terräng i varierande tempo.\

  Många timmar i sadeln kan vara jobbigt för den ovana ryttaren.


  Maxvikt: 115 kg


  Pris: 1 500 kr per person (varm skogslunch & kaffe ingår)





  ***Missa inte chansen att säkra en av de 4 unika platserna till detta småländska höstäventyr!*** 


  ***Boka nu för att säkra din plats!***




  **Varmt välkommen!**



