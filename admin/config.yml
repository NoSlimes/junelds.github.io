# Decap CMS content editor (junelds.com/admin).
# Each entry is a file under content/ (flat editor).
# Saving triggers a GitHub Action rebuilding data/*.yml (generated, do not edit).
# Keep all content fields listed here or they get wiped on save.
# Never change an existing "id" (used for price lookup).
# Filenames under content/ don't matter (regenerated from title).

backend:
  name: github
  repo: NoSlimes/junelds.github.io
  branch: main
  # Self-hosted OAuth (VPS nginx -> decap-oauth).
  base_url: https://decap.auth.noslimes.com
  auth_endpoint: /auth

# Local dev: run "npx decap-server".
local_backend: true

site_url: https://junelds.com
display_url: https://junelds.com

media_folder: "media"
public_folder: "media"

# Allow selecting/uploading multiple files at once in the media library.
media_library:
  config:
    multiple: true

collections:
  - name: "aktuellt"
    label: "Aktuellt"
    label_singular: "Nyhet"
    description: "Nyheter på startsidan. Sektionen döljs automatiskt när inget är synligt."
    folder: "content/aktuellt"
    extension: "yml"
    format: "yml"
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: ["ordning", "title"]
    fields:
      - { name: "title", label: "Rubrik", widget: "string" }
      - name: "ordning"
        label: "Ordning"
        widget: "number"
        default: 10
        hint: "Lägre nummer visas först. Befintliga ligger på 10, 20, 30 …"
      - name: "date"
        label: "Datum"
        widget: "datetime"
        required: false
        date_format: "YYYY-MM-DD"
        time_format: false
        hint: "Visas som snyggt datum. Lämna tomt om inget datum ska visas."
      - name: "text"
        label: "Brödtext"
        widget: "markdown"
        required: false
        hint: "Tom rad = nytt stycke. **fet**, punktlista med '- '."
      - name: "hidden"
        label: "Dold (utkast)"
        widget: "boolean"
        required: false
        default: false
        hint: "På = syns inte på sidan. Sektionen döljs när allt är dolt."

  - name: "turer"
    label: "Turer"
    label_singular: "Tur"
    description: "Rid- och körturer. 'Utvald' visas överst, 'dold' syns ingenstans."
    folder: "content/turer"
    extension: "yml"
    format: "yml"
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: ["ordning", "title"]
    fields:
      - { name: "title", label: "Titel", widget: "string" }
      - name: "ordning"
        label: "Ordning"
        widget: "number"
        default: 100
        hint: "Lägre nummer visas först."
      - name: "id"
        label: "ID"
        widget: "string"
        hint: "ÄNDRA ALDRIG på befintlig tur! Används för pris och bild."
      - { name: "summary", label: "Sammanfattning (kort)", widget: "text", required: false }
      - { name: "description", label: "Beskrivning", widget: "markdown", required: false }
      - { name: "image", label: "Bild", widget: "image", required: false, allow_multiple: false }
      - name: "images"
        label: "Fler bilder (bildspel)"
        widget: "list"
        required: false
        field: { name: "bild", label: "Bild", widget: "image" }
        hint: "Om listan är tom används Bild ovan. Första bilden i listan visas först."
      - name: "fokus"
        label: "Bildfokus"
        widget: "object"
        required: false
        hint: "Dra reglagen för att välja vilken del av bilden som syns."
        fields:
          - { name: "x", label: "X (vänster–höger)", widget: "percent_slider", default: 50 }
          - { name: "y", label: "Y (upp–ner)", widget: "percent_slider", default: 50 }
      - name: "details"
        label: "Faktarader"
        widget: "list"
        required: false
        field: { name: "rad", label: "Rad", widget: "string" }
        hint: "T.ex. 'Längd: ca 1,5 timmar'. Visas i popupen."
      - { name: "featured", label: "Utvald (visas överst)", widget: "boolean", required: false, default: false }
      - { name: "hidden", label: "Dold", widget: "boolean", required: false, default: false }
      - name: "imageTransform"
        label: "Bildjustering (avancerat)"
        widget: "select"
        required: false
        options:
          - { label: "Standard (ingen)", value: "" }
          - { label: "Ner 20 px", value: "translateY(20px)" }
          - { label: "Ner 30 px", value: "translateY(30px)" }
          - { label: "Ner 60 px", value: "translateY(60px)" }
        hint: "Finjustering i höjdled. Prova Bildfokus först."

  - name: "tjanster"
    label: "Övriga tjänster"
    label_singular: "Tjänst"
    description: "Tjänster som inkörning, bröllopskörning och ridgrupper."
    folder: "content/tjanster"
    extension: "yml"
    format: "yml"
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: ["ordning", "title"]
    fields:
      - { name: "title", label: "Titel", widget: "string" }
      - name: "ordning"
        label: "Ordning"
        widget: "number"
        default: 100
        hint: "Lägre nummer visas först."
      - name: "id"
        label: "ID"
        widget: "string"
        hint: "ÄNDRA ALDRIG på befintlig tjänst! Används för priskoppling."
      - { name: "summary", label: "Sammanfattning (kort)", widget: "text", required: false }
      - { name: "description", label: "Beskrivning", widget: "markdown", required: false }
      - { name: "image", label: "Bild", widget: "image", required: false, allow_multiple: false }
      - name: "images"
        label: "Fler bilder (bildspel)"
        widget: "list"
        required: false
        field: { name: "bild", label: "Bild", widget: "image" }
        hint: "Om listan är tom används Bild ovan. Första bilden i listan visas först."
      - name: "fokus"
        label: "Bildfokus"
        widget: "object"
        required: false
        hint: "Dra reglagen för att välja vilken del av bilden som syns."
        fields:
          - { name: "x", label: "X (vänster–höger)", widget: "percent_slider", default: 50 }
          - { name: "y", label: "Y (upp–ner)", widget: "percent_slider", default: 50 }
      - { name: "hidden", label: "Dold", widget: "boolean", required: false, default: false }

  - name: "priser"
    label: "Prislista"
    label_singular: "Kategori"
    description: "Priskategorier. ID:t på varje rad måste matcha turens/tjänstens ID."
    folder: "content/priser"
    extension: "yml"
    format: "yml"
    create: true
    slug: "{{slug}}"
    summary: "{{category}}"
    fields:
      - { name: "category", label: "Kategorinamn", widget: "string" }
      - name: "ordning"
        label: "Ordning"
        widget: "number"
        default: 100
        hint: "Lägre nummer visas först."
      - name: "items"
        label: "Prisrader"
        widget: "list"
        summary: "{{fields.name}} – {{fields.price}}"
        fields:
          - name: "id"
            label: "ID"
            widget: "string"
            hint: "Måste matcha turens/tjänstens ID för att priset ska synas i popupen."
          - { name: "name", label: "Namn", widget: "string" }
          - name: "price"
            label: "Pris"
            widget: "text"
            hint: "**fet** funkar. Flera rader tillåtna."
          - { name: "duration", label: "Längd", widget: "string", required: false }
          - { name: "note", label: "Notering", widget: "text", required: false }

  - name: "installningar"
    label: "Inställningar"
    label_singular: "Fil"
    description: "Om oss-text och länkar till sociala medier."
    files:
      - name: "sida"
        label: "Sidinställningar"
        file: "content/site.yml"
        fields:
          - name: "hero"
            label: "Toppsektion (hero)"
            widget: "object"
            fields:
              - { name: "rubrik", label: "Rubrik", widget: "string" }
              - { name: "text", label: "Text", widget: "text" }
              - { name: "knapp", label: "Knapptext", widget: "string" }
          - name: "omOss"
            label: "Om oss"
            widget: "object"
            fields:
              - { name: "stycke1", label: "Stycke 1", widget: "text" }
              - { name: "stycke2", label: "Stycke 2", widget: "text", required: false }
          - name: "social"
            label: "Sociala medier"
            widget: "object"
            fields:
              - name: "instagram"
                label: "Instagram-länk"
                widget: "string"
                required: false
                hint: "Tomt = knappen döljs."
              - name: "facebook"
                label: "Facebook-länk"
                widget: "string"
                required: false
                hint: "Tomt = knappen döljs."

  - name: "galleri"
    label: "Bildgalleri"
    label_singular: "Fil"
    description: "Bilder i karusellen på startsidan. Dra för att ordna om."
    files:
      - name: "bilder"
        label: "Bilder"
        file: "content/galleri.yml"
        fields:
          - name: "bilder"
            label: "Bilder"
            widget: "list"
            summary: "{{fields.caption}}"
            fields:
              - name: "bild"
                label: "Bild"
                widget: "image"
                media_folder: "/media/gallery"
                public_folder: "/media/gallery"
                hint: "Nya uppladdningar hamnar i media/gallery."
              - { name: "alt", label: "Alt-text", widget: "string", required: false }
              - { name: "caption", label: "Bildtext", widget: "text", required: false }
