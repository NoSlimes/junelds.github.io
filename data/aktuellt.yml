poster:
  - title: Det finns plats för ytterligare hästar för inkörning och/eller inridning
    date: 2027-01-01
    text: 'Från årsskiftet (januari -27) kommer jag att ha möjlighet att ta emot ytterligare ett par hästar och/eller ponnyer för inkörning


      Vill du även ha din häst grundinriden så gör jag det med fördel i samband med inkörningen.\

      Rider in ponnyer och hästar från storlek, kraftigare c-ponny och uppåt.


      Man kan räkna med att det tar ca 2 månader för att få hästen körbar med rockard, och ytterligare 2 månader att få den ordentligt körbar med fyrhjulsvagn. Då det bästa är att "skynda långsam"

      Den tid det tar beror såklart mycket på hur pass väl förberedd hästen är innan den kommer till oss och hur mycket förarbete som vi behöver lägga ner innan det är dags att sätta hästen för vagn.

      Men även en hel del på hästen själv. Dess mentalitet och hur snabb och villig den är till att lära.


      Vi uppdaterar löpande om träningen, vad vi gör och hur allt går. Mot slutet är du som ägare med fördel med så mycket som möjligt, för att lära tillsammans med din häst.


      Grovfoder ingår i uppstallningskostnaden. Eventuellt kraftfoder bekostas av hästägaren.

      Hästen kommer att gå på lösdrift med tillgång till vindskydd.


      Du står för egen utrustning (sele, huvudlag, borstar etc). Även vagn för mindre ponny .

      Vagnar för större ponny och häst finns här.'
    hidden: false
